name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore HorseRacingML.sln
      - name: Build
        run: dotnet build HorseRacingML.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test HorseRacingML/Tests/HorseRacingML.Tests.csproj --configuration Release --no-build --filter "Category!=Integration"
        env:
          DOTNET_NOLOGO: true
